<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
<title id="title">MAC pipeline stages</title>
<desc id="desc">Stage 1 multiplies two BF16 values into an FP32 product. Stage 2 aligns, adds, and normalizes that product into the accumulator.</desc>
<rect x="1" y="1" width="918" height="248" rx="12" fill="#fffdfb" stroke="#e7e5e4"/>
<text x="28" y="32" fill="#78716c" font-family="Georgia, serif" font-size="13">Pipeline stages</text>
<text x="28" y="56" fill="#1c1917" font-family="Georgia, serif" font-size="16">Multiply, then accumulate, each in its own cycle</text>
<rect x="28" y="80" width="400" height="142" rx="8" fill="#fff" stroke="#e7e5e4"/>
<rect x="28.5" y="92" width="3" height="118" fill="#9a3412"/>
<text x="48" y="108" fill="#9a3412" font-family="ui-monospace,Menlo,monospace" font-size="11">01</text>
<text x="48" y="134" fill="#1c1917" font-family="Georgia, serif" font-size="18">BF16 multiply</text>
<text x="48" y="160" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Two 16-bit operands</text>
<text x="48" y="180" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Sign XOR, exponent minus 127, 8x8 mantissa</text>
<text x="48" y="200" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Product is FP32, with valid_s1</text>
<path d="M428 151 H488" fill="none" stroke="#9a3412" stroke-width="1.5"/>
<path d="M483 147.5 l6 3.5 -6 3.5" fill="#9a3412"/>
<rect x="496" y="80" width="396" height="142" rx="8" fill="#fff" stroke="#e7e5e4"/>
<rect x="496.5" y="92" width="3" height="118" fill="#9a3412"/>
<text x="516" y="108" fill="#9a3412" font-family="ui-monospace,Menlo,monospace" font-size="11">02</text>
<text x="516" y="134" fill="#1c1917" font-family="Georgia, serif" font-size="18">FP32 accumulate</text>
<text x="516" y="160" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Product plus the accumulator</text>
<text x="516" y="180" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Align, add or subtract, then normalize</text>
<text x="516" y="200" fill="#57534e" font-family="Arial,Helvetica,sans-serif" font-size="13">Next accumulator, with valid</text>
</svg>
