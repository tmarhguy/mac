<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">MAC datapath</title><desc id="desc">Pin stream: Four 8-bit cycles carry operands A and B.; BF16 multiply: Stage 1 promotes the product to FP32.; FP32 accumulate: Stage 2 adds that product into the accumulator.; Result stream: The 32-bit result leaves in two output phases.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:var(--diagram-ink,#202020)}.detail{font-size:14px;fill:var(--diagram-muted,#595959)}.label{font-size:16px;font-weight:600}.num{font-family:monospace;font-size:12px;fill:var(--diagram-number,#757575)}</style>
<rect x=".5" y=".5" width="799" height="459" rx="10" fill="var(--diagram-paper,#fff)" stroke="var(--diagram-line,#dedede)"/>
<text x="28" y="35" class="label">MAC datapath</text>
<text x="28" y="58" class="detail">BF16 multiply, then FP32 accumulate</text>
<rect x="28" y="78" width="744" height="72" rx="6" fill="var(--diagram-edge,#f4f4f4)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="107" class="num">01</text>
<text x="80" y="107" class="label">Pin stream</text>
<text x="80" y="129" class="detail">Four 8-bit cycles carry operands A and B.</text>
<path d="M 57 150 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="166" width="744" height="72" rx="6" fill="var(--diagram-row,#fafafa)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="195" class="num">02</text>
<text x="80" y="195" class="label">BF16 multiply</text>
<text x="80" y="217" class="detail">Stage 1 promotes the product to FP32.</text>
<path d="M 57 238 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="254" width="744" height="72" rx="6" fill="var(--diagram-row,#fafafa)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="283" class="num">03</text>
<text x="80" y="283" class="label">FP32 accumulate</text>
<text x="80" y="305" class="detail">Stage 2 adds that product into the accumulator.</text>
<path d="M 57 326 v 13 m -3 -4 l 3 4 l 3 -4" fill="none" stroke="var(--diagram-number,#999)"/>
<rect x="28" y="342" width="744" height="72" rx="6" fill="var(--diagram-edge,#f4f4f4)" stroke="var(--diagram-line,#dedede)"/>
<text x="44" y="371" class="num">04</text>
<text x="80" y="371" class="label">Result stream</text>
<text x="80" y="393" class="detail">The 32-bit result leaves in two output phases.</text>
</svg>
