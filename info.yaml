# Tiny Tapeout project information
project:
  title: "16-Bit MAC Unit for ML Acceleration"
  author: "Tyrone Iras Marhguy"
  discord: ""
  description: "BFloat16 multiply-accumulate with FP32 accumulator"
  language: "Verilog"
  clock_hz: 50000000

  # Single tile first; increase (e.g. 1x2) if hardening reports area failures
  tiles: "1x1"

  top_module: "tt_um_tensor_mac"

  source_files:
    - "tt_um_tensor_mac.v"
    - "mac_core.sv"

# Pin labels for the Tiny Tapeout documentation PDF
pinout:
